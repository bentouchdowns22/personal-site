<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>
/* ==========================================================================
   CONFIG — edit your text and links here. Nothing below this block needs
   to change. Links render in order, numbered 01, 02, 03 …
   ========================================================================== */
const CONFIG = {
  name: "Benjamin Atkinson",
  descriptor: "Current senior at Babson College.",
  links: [
    { label: "Side projects",    url: "#",                      note: "Coming soon" },
    { label: "GitHub",           url: "#",                      note: "Code" },
    { label: "LinkedIn",         url: "https://www.linkedin.com/in/benjaminatkinson0", note: "Work" },
    { label: "Substack",         url: "https://substack.com/@benjaminmichaelatkinson", note: "Writing" },
    { label: "Email",            url: "mailto:you@example.com", note: "Contact" },
  ],
};
/* ======================== END CONFIG ===================================== */

document.addEventListener("DOMContentLoaded", () => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text || "" });

  document.title = CONFIG.name;
  document.querySelectorAll("[data-meta=name]").forEach((m) => (m.content = CONFIG.name));
  document.querySelectorAll("[data-meta=descriptor]").forEach((m) => (m.content = CONFIG.descriptor));

  $("#name").textContent = CONFIG.name;
  $("#descriptor").textContent = CONFIG.descriptor;
  $("#colophon").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;

  $("#links").append(...CONFIG.links.map((link, i) => {
    const a = el("a", "row");
    a.href = link.url;
    if (/^https?:\/\//i.test(link.url) && new URL(link.url).host !== location.host) a.rel = "noopener";
    const idx = el("span", "idx", String(i + 1).padStart(2, "0"));
    const arrow = el("span", "arrow", "→");
    idx.setAttribute("aria-hidden", "true");
    arrow.setAttribute("aria-hidden", "true");
    a.append(idx, el("span", "label", link.label), el("span", "note", link.note), arrow);
    const li = el("li");
    li.append(a);
    return li;
  }));
});
</script>

<!-- Static copies of CONFIG values. Link-preview scrapers (iMessage, Slack,
     X, LinkedIn) don't run JavaScript, so update these when you edit CONFIG. -->
<title>Benjamin Atkinson</title>
<meta name="description" data-meta="descriptor" content="Current senior at Babson College.">
<meta property="og:type" content="website">
<meta property="og:title" data-meta="name" content="Benjamin Atkinson">
<meta property="og:description" data-meta="descriptor" content="Current senior at Babson College.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" data-meta="name" content="Benjamin Atkinson">
<meta name="twitter:description" data-meta="descriptor" content="Current senior at Babson College.">

<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' fill='%23161616'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@300&display=swap">

<style>
  :root {
    --bg: #ffffff;
    --text: #161616;
    --muted: #525252;
    --rule: #e0e0e0;
    --accent: #0f62fe;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }

  html { background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }

  body {
    max-width: calc(640px + 2 * 24px);
    padding: 96px 24px;
    background: var(--bg);
    font: 400 14px/24px var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font: 300 32px/40px var(--sans);
    letter-spacing: 0;
  }

  #descriptor { margin-top: 16px; color: var(--muted); max-width: 56ch; }

  nav { margin-top: 64px; }

  ol { list-style: none; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }

  .row {
    display: grid;
    grid-template-columns: 32px 1fr auto 16px;
    column-gap: 16px;
    align-items: baseline;
    padding: 12px 0;
    color: var(--text);
    text-decoration: none;
  }

  .idx, .note, footer {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .note { text-align: right; }

  .label, .arrow { transition: color 150ms ease; }
  .arrow { color: transparent; text-align: right; }

  .row:hover .label, .row:hover .arrow,
  .row:focus-visible .label, .row:focus-visible .arrow { color: var(--accent); }

  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 96px; }

  /* Narrow screens: note drops below the label */
  @media (max-width: 599px) {
    .row {
      grid-template-columns: 32px 1fr 16px;
      grid-template-areas: "idx label arrow" ". note .";
    }
    .idx { grid-area: idx; }
    .label { grid-area: label; }
    .note { grid-area: note; text-align: left; }
    .arrow { grid-area: arrow; }
  }

  @media (min-width: 672px) {
    body { max-width: calc(640px + 2 * 64px); padding: 128px 64px; }
    h1 { font-size: 40px; line-height: 48px; }
  }

  @media (min-width: 1056px) {
    body { max-width: calc(640px + 128px + 64px); padding: 160px 64px 160px 128px; }
  }
</style>
</head>
<body>
  <header>
    <h1 id="name"></h1>
    <p id="descriptor"></p>
  </header>

  <main>
    <nav aria-label="Links">
      <ol id="links"></ol>
    </nav>
  </main>

  <footer>
    <p id="colophon"></p>
  </footer>
</body>
</html>
