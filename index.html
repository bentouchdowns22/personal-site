<script>
/* ==========================================================================
   CONFIG — edit your text and links here. Nothing below this block needs
   to change. Links render in order, numbered 01, 02, 03 …
   ========================================================================== */
const CONFIG = {
  name: "Benjamin Atkinson",
  descriptor: "Current senior at Babson College.",
  links: [
    { label: "Side projects",    url: "#",                      note: "Coming soon" },
    { label: "GitHub",           url: "https://github.com/bentouchdowns22", note: "Code" },
    { label: "LinkedIn",         url: "https://www.linkedin.com/in/benjaminatkinson0", note: "Work" },
    { label: "Substack",         url: "https://substack.com/@benjaminmichaelatkinson", note: "Writing" },
    { label: "Email",            url: "mailto:benatkinson38@gmail.com", note: "Contact" },
  ],
};
/* ======================== END CONFIG ===================================== */

document.addEventListener("DOMContentLoaded", () => {
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls, textContent: text || "" });

  document.title = CONFIG.name;
  document.querySelectorAll("[data-meta=name]").forEach((m) => (m.content = CONFIG.name));
  document.querySelectorAll("[data-meta=descriptor]").forEach((m) => (m.content = CONFIG.descriptor));

  $("#name").textContent = CONFIG.name;
  $("#descriptor").textContent = CONFIG.descriptor;
  $("#colophon").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}`;

  $("#links").append(...CONFIG.links.map((link, i) => {
    const a = el("a", "row");
    a.href = link.url;
    if (/^https?:\/\//i.test(link.url) && new URL(link.url).host !== location.host) { a.target = "_blank"; a.rel = "noopener"; }
    const idx = el("span", "idx", String(i + 1).padStart(2, "0"));
    const arrow = el("span", "arrow", "→");
    idx.setAttribute("aria-hidden", "true");
    arrow.setAttribute("aria-hidden", "true");
    a.append(idx, el("span", "label", link.label), el("span", "note", link.note), arrow);
    const li = el("li");
    li.append(a);
    return li;
  }));
});
</script>

<style>
  :root {
    --bg: #ffffff;
    --text: #161616;
    --muted: #525252;
    --rule: #e0e0e0;
    --accent: #0f62fe;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --pad-l: 24px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }

  html { background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; overflow-x: hidden; }

  body {
    max-width: calc(640px + 2 * 24px);
    padding: 96px 24px 0;
    background: var(--bg);
    font: 400 14px/24px var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font: 300 32px/40px var(--sans);
    letter-spacing: 0;
  }

  #descriptor { margin-top: 16px; color: var(--muted); max-width: 56ch; }

  nav { margin-top: 64px; }

  ol { list-style: none; border-top: 1px solid var(--rule); }
  li { border-bottom: 1px solid var(--rule); }

  .row {
    display: grid;
    grid-template-columns: 32px 1fr auto 16px;
    column-gap: 16px;
    align-items: baseline;
    padding: 12px 0;
    color: var(--text);
    text-decoration: none;
  }

  .idx, .note, footer {
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .note { text-align: right; }

  .label, .arrow { transition: color 150ms ease; }
  .arrow { color: transparent; text-align: right; }

  .row:hover .label, .row:hover .arrow,
  .row:focus-visible .label, .row:focus-visible .arrow { color: var(--accent); }

  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  footer { margin-top: 96px; }

  /* Footer illustration: full-bleed row of Ionic column tops; shafts fade out downward */
  .art {
    width: 100vw;
    height: max(150px, 13vw);
    margin: 32px 0 0 calc(-1 * var(--pad-l));
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, #000 50%, transparent);
    mask-image: linear-gradient(to bottom, #000 50%, transparent);
  }
  .art svg { display: block; width: 100%; height: 100%; }

  /* Narrow screens: note drops below the label */
  @media (max-width: 599px) {
    .row {
      grid-template-columns: 32px 1fr 16px;
      grid-template-areas: "idx label arrow" ". note .";
    }
    .idx { grid-area: idx; }
    .label { grid-area: label; }
    .note { grid-area: note; text-align: left; }
    .arrow { grid-area: arrow; }
  }

  @media (min-width: 672px) {
    :root { --pad-l: 64px; }
    body { max-width: calc(640px + 2 * 64px); padding: 128px 64px 0; }
    h1 { font-size: 40px; line-height: 48px; }
  }

  @media (min-width: 1056px) {
    :root { --pad-l: 128px; }
    body { max-width: calc(640px + 128px + 64px); padding: 160px 64px 0 128px; }
  }
</style>
