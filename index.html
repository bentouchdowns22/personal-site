<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benjamin Atkinson</title>
<meta name="description" content="Hi, my name is Benjamin Atkinson. Currently a senior at Babson College.">
<meta property="og:type" content="website">
<meta property="og:title" content="Benjamin Atkinson">
<meta property="og:description" content="Hi, my name is Benjamin Atkinson. Currently a senior at Babson College.">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='4' y='4' width='8' height='8' fill='%23161616'/%3E%3C/svg%3E">

<!-- IBM Plex Mono: the monospace face of IBM's Carbon design system -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap">

<style>
  :root {
    --bg: #ffffff;
    --text: #161616;
    --accent: #0f62fe;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }

  body {
    max-width: calc(640px + 2 * 24px);
    padding: 96px 24px;
    font: 400 16px/28px var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: inherit;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
    transition: color 150ms ease;
  }
  a:hover, a:focus-visible { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.15em;
    margin-left: 2px;
    vertical-align: -0.2em;
    background: currentColor;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (min-width: 672px) {
    body { max-width: calc(640px + 2 * 64px); padding: 128px 64px; font-size: 18px; line-height: 32px; }
  }
  @media (min-width: 1056px) {
    body { max-width: calc(640px + 128px + 64px); padding: 160px 64px 160px 128px; }
  }
</style>
</head>
<body>
  <main>
    <p id="intro">Hi, my name is Benjamin Atkinson. Currently a senior at <a href="https://babson.edu" target="_blank" rel="noopener">Babson College</a>, and here are some of the things I am passionate about/interested in:</p>
  </main>

  <script>
    // Types out #intro one character at a time, keeping links intact.
    // Without JavaScript, or with reduced motion on, the text shows in full.
    (() => {
      const intro = document.getElementById("intro");
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      const parts = [...intro.childNodes].map((n) => ({
        text: n.textContent,
        shell: n.nodeType === Node.ELEMENT_NODE ? n.cloneNode(false) : null,
      }));
      const cursor = Object.assign(document.createElement("span"), { className: "cursor" });
      cursor.setAttribute("aria-hidden", "true");
      intro.setAttribute("aria-busy", "true");
      intro.replaceChildren(cursor);

      let i = 0, j = 0, node = null;
      const type = () => {
        if (i === parts.length) return intro.setAttribute("aria-busy", "false");
        const part = parts[i];
        if (j === 0) intro.insertBefore((node = part.shell || document.createTextNode("")), cursor);
        const ch = part.text[j++];
        node.textContent += ch;
        if (j === part.text.length) { i++; j = 0; }
        setTimeout(type, /[.,:]/.test(ch) ? 320 : 30 + Math.random() * 40);
      };
      setTimeout(type, 600);
    })();
  </script>
</body>
</html>
